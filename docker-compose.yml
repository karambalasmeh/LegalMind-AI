version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: legalmind_graph
    ports:
      - "7474:7474"  
      - "7687:7687"  
    environment:
      - NEO4J_PLUGINS=["apoc"]        
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - ./neo4j_data:/data            
    restart: unless-stopped